# docker-compose.yml - Define los servicios para la aplicación de riego automático
# Ejecuta con: docker-compose up --build

services:
  app:
    build: .
    ports:
      - "8501:8501"
    devices:
      - "${ARDUINO_PORT}:/dev/ttyUSB1"
    env_file:
      - .env
    volumes:
      - .:/app
    restart: unless-stopped